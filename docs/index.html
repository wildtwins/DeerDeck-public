<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Withrow DeerDeck Support</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #101828; background: #f4f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
    h1 { color: #0046be; font-size: 2.5rem; margin-bottom: 8px; }
    p, li { line-height: 1.6; }
    a { color: #0046be; }
    .accent { width: 72px; height: 8px; background: #ffd800; margin: 24px 0; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e7eef9; background: #0d1723; }
      h1, a { color: #7db7ff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Withrow DeerDeck</h1>
    <p>Field observation logging, media, environmental context, history, statistics, and user-controlled backups for Android.</p>
    <div class="accent"></div>
    <h2>Support</h2>
    <p>Visit <a href="https://github.com/wildtwins">https://github.com/wildtwins</a> for help with the app, a backup, or a data deletion question.</p>
    <h2>Privacy</h2>
    <p><a href="privacy-policy.html">Read the Withrow DeerDeck Privacy Policy</a>.</p>
  </main>

</html>
